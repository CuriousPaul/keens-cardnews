<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Keens Editorial Card Template (v2)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  /* ============================================================
     KEENS — @keensacademy 에디토리얼 카드뉴스 스타일 (레퍼런스 재현)
     다크 시네마틱 사진 배경 / 좌하단 굵은 헤드라인 / 라벨·소제목·푸터
     ============================================================ */
  :root {
    --c-photo-base: #0B1626;       /* 사진 없을 때 베이스(네이비-블랙) */
    --c-overlay:    rgba(8,16,30,.55); /* 사진 위 가독성 오버레이 */
    --c-ink:        #FFFFFF;
    --c-ink-soft:   #C9D2E2;
    --c-kicker:     #8FA6CF;        /* 라벨(연한 블루) */
    --c-accent:     #E8472B;        /* Keens 레드(로고/포인트) */
    --c-footer:     #8C97AA;

    --font-en: 'Inter', 'Noto Sans KR', sans-serif;
    --font-kr: 'Noto Sans KR', 'Inter', sans-serif;

    --card-w: 1080px; --card-h: 1350px;
    --pad: 84px;
    --brand: 'Keens';
    --handle: '@KEENSACADEMY';
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#222; }

  .card {
    width:var(--card-w); height:var(--card-h);
    position:relative; overflow:hidden;
    background:
      linear-gradient(180deg, rgba(6,12,24,.22) 0%, rgba(6,12,24,.30) 38%, rgba(5,10,20,.80) 70%, rgba(3,7,15,.97) 100%),
      var(--c-photo-base);
    background-size:cover; background-position:center;
    color:var(--c-ink); font-family:var(--font-en);
    display:flex; flex-direction:column; justify-content:flex-end;
    padding:var(--pad);
    margin:0 auto 32px;
  }
  .card[data-lang="ko"] { font-family:var(--font-kr); }

  /* 사진 위에 깔리는 좌측 가독성 셰이딩(텍스트 영역) */
  .card::after {
    content:""; position:absolute; inset:0; z-index:0;
    background:
      linear-gradient(90deg, rgba(5,10,20,.86) 0%, rgba(5,10,20,.40) 50%, rgba(5,10,20,0) 78%),
      linear-gradient(0deg, rgba(3,7,15,.90) 0%, rgba(3,7,15,.45) 26%, rgba(3,7,15,0) 46%);
  }
  .card > * { position:relative; z-index:1; }

  /* 상단 라벨 */
  .kicker {
    position:absolute; top:var(--pad); left:var(--pad); z-index:1;
    font-size:30px; font-weight:700; letter-spacing:5px; text-transform:uppercase;
    color:var(--c-kicker);
  }

  /* 본문 블록(좌하단) */
  .block { max-width:880px; }
  .headline {
    font-size:104px; font-weight:800; line-height:1.04; letter-spacing:-2px;
    color:var(--c-ink); white-space:pre-line; margin-bottom:30px;
    word-break:keep-all; overflow-wrap:break-word;
  }
  .headline .hl { color:var(--c-accent); }
  .headline .u  { box-shadow: inset 0 -.14em 0 var(--c-accent); }
  .subhead {
    font-size:42px; font-weight:500; line-height:1.34; color:var(--c-ink-soft);
    white-space:pre-line; max-width:820px; word-break:keep-all; overflow-wrap:break-word;
  }
  .subhead strong { color:#fff; font-weight:700; }

  /* 통계 강조형(인사이트 카드) */
  .stat { font-size:200px; font-weight:900; letter-spacing:-4px; line-height:.9;
          color:#fff; margin-bottom:14px; }
  .stat .unit { font-size:80px; vertical-align:8px; color:var(--c-kicker); }

  /* CTA 버튼형 */
  .cta {
    display:inline-flex; align-items:center; gap:18px; margin-top:40px;
    background:var(--c-accent); color:#fff; font-weight:800; font-size:42px;
    padding:28px 52px; border-radius:14px;
  }

  /* 푸터: 워드마크 | 핸들  ····  01 / 07 */
  .footer {
    position:absolute; left:var(--pad); right:var(--pad); bottom:54px; z-index:1;
    display:flex; align-items:center; justify-content:space-between;
    color:var(--c-footer); font-size:26px; font-weight:600; letter-spacing:1px;
  }
  .footer .left { display:flex; align-items:center; gap:18px; }
  .footer .wordmark { font-weight:900; color:#fff; letter-spacing:1px; font-size:28px; }
  .footer .bar { color:#5b6678; }
  .footer .page { font-variant-numeric:tabular-nums; letter-spacing:4px; }

  /* 본문 블록을 푸터 위로 띄우기 */
  .block { margin-bottom:96px; }
</style>
</head>
<body>
<!--
  card_template_keens.html — @keensacademy 룩 재현 (v2)
  - content.json 의 각 카드: { kicker, headline, subhead, stat, cta, bg }
  - bg: 배경 사진 URL(있으면 사용). 없으면 네이비-블랙 그라데이션.
  - render_cards.js 로 동일하게 렌더(window.CARD_DATA + build()).
  데모 렌더는 실제 사진 대신 그라데이션만 사용 — 프로덕션에선 스튜디오 사진/AI 배경 주입.
-->
<div id="stage"></div>
<script>
  window.CARD_DATA = window.CARD_DATA || {
    "post_id":"KEENS-DEMO","lang":"en","total":7,
    "cards":[
      {"kicker":"KPOP AUDITION","headline":"Reddit got\nKPOP auditions <span class='hl'>wrong.</span>",
       "subhead":"Age, skill, visuals — <strong>what agencies actually read.</strong>"}
    ]
  };

  function el(t,c,h){const n=document.createElement('div');if(c)n.className=c;if(h!=null)n.innerHTML=h;return n;}

  function buildCard(card, idx, total, lang){
    const c = el('div','card'); c.dataset.lang = lang;
    if(card.bg) c.style.backgroundImage =
      "linear-gradient(180deg, rgba(6,12,24,.22) 0%, rgba(6,12,24,.30) 38%, rgba(5,10,20,.80) 70%, rgba(3,7,15,.97) 100%), url('"+card.bg+"')";

    if(card.kicker) c.appendChild(el('div','kicker', card.kicker));

    const block = el('div','block');
    if(card.body_html){
      // open-carrusel 패턴: 카드별 자유 body HTML(래퍼가 치수·폰트·브랜드 강제)
      block.innerHTML = card.body_html;
    } else {
      if(card.stat) block.appendChild(el('div','stat', card.stat));
      if(card.headline) block.appendChild(el('div','headline', card.headline));
      if(card.subhead)  block.appendChild(el('div','subhead', card.subhead));
      if(card.cta)      block.appendChild(el('div','cta', "➜&nbsp;&nbsp;"+card.cta));
    }
    c.appendChild(block);

    const css = getComputedStyle(document.documentElement);
    const brand = (css.getPropertyValue('--brand')||"'Keens'").replace(/['"]/g,'').trim();
    const handle = (css.getPropertyValue('--handle')||"'@keens'").replace(/['"]/g,'').trim();
    const footer = el('div','footer');
    const left = el('div','left');
    left.appendChild(el('div','wordmark', brand));
    left.appendChild(el('div','bar','|'));
    left.appendChild(el('div',null, handle));
    footer.appendChild(left);
    footer.appendChild(el('div','page', String(idx+1).padStart(2,'0')+' / '+String(total).padStart(2,'0')));
    c.appendChild(footer);
    return c;
  }

  // 외부화된 브랜드/테마 토큰 (open-carrusel brand.json 패턴 + prompt_what 프리미엄 에디토리얼)
  const THEMES = {
    'stage-photo': {}, // 기본(다크 시네마틱 스테이지 사진) — 토큰 그대로
    'editorial-gold': { // 프리미엄 에디토리얼: 차콜 + 골드 + 크림 (사진 없이 플랫 배경)
      '--c-photo-base':'#0E1116', '--c-accent':'#C8A24B', '--c-cta-bg':'#C8A24B',
      '--c-kicker':'#C8A24B', '--c-ink-soft':'#E7E1D4'
    }
  };
  function applyBrand(d){
    const t = THEMES[d.theme]; if(t) for(const k in t) document.documentElement.style.setProperty(k, t[k]);
    if(d.brand){ // {accent, handle, brandName, font...} 외부 주입
      const m = {accent:'--c-accent', handle:'--handle', brandName:'--brand'};
      for(const k in m){ if(d.brand[k]!=null){
        const v = (k==='handle'||k==='brandName') ? "'"+d.brand[k]+"'" : d.brand[k];
        document.documentElement.style.setProperty(m[k], v);
      }}
    }
  }
  function build(){
    const d = window.CARD_DATA, stage = document.getElementById('stage');
    applyBrand(d);
    stage.innerHTML='';
    const total = d.total || d.cards.length;
    d.cards.forEach((card,i)=> stage.appendChild(buildCard(card,i,total,d.lang||'en')));
  }
  build();
</script>
</body>
</html>
